name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore STool.sln

      - name: Build
        run: dotnet build STool.sln -c Release --no-restore

      - name: Test
        run: dotnet test Tests/STool.Tests.csproj -c Release --no-build --no-restore --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build portable package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          ./build-portable.ps1 -Version $version -SkipTests

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: portable
          path: artifacts/releases/*.zip

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create $env:RELEASE_TAG (Get-ChildItem artifacts/releases/*.zip).FullName --draft --generate-notes --title "STool $env:RELEASE_TAG"
